<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin">
<title>配達ルート</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="配達ルート">
<meta name="theme-color" content="#FFE9C7">
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#20241f;--sub:#646b60;--line:#dcdfd6;--main:#2e7d4f;--main-ink:#fff;--soft:#e4f1e8;--warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:150px}
main{max-width:760px;margin:0 auto;padding:12px 16px}
h2{font-size:18px;margin:18px 0 8px}
button,input,textarea,select{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=number],input[type=password],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.primary,a.primary{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;background:none;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--main);color:var(--ink);font-weight:700}
.row-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row-line>input{flex:1;min-width:160px}
.muted{color:var(--sub);font-size:14px}
.cust{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.cust.on{background:var(--soft);border-color:var(--main)}
.cust input{width:24px;height:24px;flex:none;accent-color:var(--main)}
.no{font-weight:700;min-width:2.6em;font-variant-numeric:tabular-nums}
.addr{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.grow{flex:1;min-width:0}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:5}
.bottom div{max-width:728px;margin:0 auto}
.bottom button{width:100%;min-height:52px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.card.warn{background:var(--warn-bg);border-color:#ecd2a2;color:var(--warn)}
.card h3{margin:0 0 6px;font-size:17px}
.card ul{margin:8px 0;padding-left:20px}
.stop{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop{gap:6px}
.idx{flex:none;width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.mv{min-width:40px;padding:4px}
.drag{flex:none;width:40px;height:44px;display:grid;place-items:center;font-size:24px;line-height:1;color:var(--sub);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dragitem{background:var(--card)}
.dragging{box-shadow:0 6px 18px #0004;border-radius:8px;position:relative;z-index:3}
a.primary{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:8px;margin-top:8px}
dialog{border:0;border-radius:12px;padding:18px;width:min(92vw,480px)}
dialog::backdrop{background:#0006}
label.f{display:block;margin:10px 0;font-size:14px;color:var(--sub)}
.pos{width:64px!important;flex:none;padding:8px 4px;text-align:center}
.empty{text-align:center;padding:30px 8px;color:var(--sub)}
body.locked .tabs,body.locked main,body.locked .bottom{display:none}
#gate{max-width:420px;margin:0 auto;padding:48px 16px}
body:not(.locked) #gate{display:none}
#gate h1{font-size:22px;margin:0 0 8px}
#gate input{font-size:22px;letter-spacing:.15em;text-align:center}
#gate button{width:100%;margin-top:12px}
#gate button.link{border:0;background:none;color:var(--sub);text-decoration:underline}
.err{color:var(--bad);min-height:1.5em;font-size:14px;margin:8px 0 0}
.ng{color:var(--bad);font-size:14px;font-weight:700;display:block;overflow-wrap:anywhere}
</style>
</head>
<body class="locked">
<section id="gate"></section>
<nav class="tabs" id="tabs">
  <button data-tab="check">チェック</button>
  <button data-tab="route">ルート</button>
  <button data-tab="list">顧客</button>
  <button data-tab="set">設定</button>
</nav>
<main id="view"></main>
<div class="bottom" id="bottom" hidden><div><button class="primary" id="makeRoute"></button></div></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
'use strict';
/* ========== データ保存（この端末のブラウザ内に、PINで暗号化して保存） ========== */
const KEY_V1 = 'yoshikei-route-v1';              // 暗号化前の形式（移行のためだけに読む）
const KEY_ENC = 'yoshikei-route-enc-v2';
const KEY_FAIL = 'yoshikei-route-fails';
const PBKDF2_ITER = 600000;
const MAX_URL = 2000;                            // Googleの上限2048文字に余裕を持たせる

const blank = () => ({
  customers: [],
  settings: { start: '', end: '', sameEnd: true, maxWp: 9, autoLockMin: 15, mapsKey: '' },
  today: { date: '', checked: [], order: null, manual: false }
});
const withDefaults = d => ({ ...blank(), ...d, settings: { ...blank().settings, ...d.settings } });
function readV1() {
  try { const d = JSON.parse(localStorage.getItem(KEY_V1)); return d && d.customers ? withDefaults(d) : null; }
  catch (e) { return null; }
}
let db = blank(), cryptoKey = null, keyMeta = null, lockSession = 0, lastActive = Date.now(), saveQueue = Promise.resolve();

const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt, iter) {
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, raw,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function writeRecord(key, meta, json) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(json));
  localStorage.setItem(KEY_ENC, JSON.stringify({ v: 2, salt: toB64(meta.salt), iter: meta.iter, iv: toB64(iv), ct: toB64(ct) }));
}
function readRecord() {
  try { return JSON.parse(localStorage.getItem(KEY_ENC)); } catch (e) { return null; }
}
async function openRecord(pin) {                  // PINが違うとnullを返す
  const rec = readRecord(), salt = fromB64(rec.salt), key = await deriveKey(pin, salt, rec.iter);
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(rec.iv) }, key, fromB64(rec.ct));
    return { key, meta: { salt, iter: rec.iter }, data: withDefaults(JSON.parse(new TextDecoder().decode(plain))) };
  } catch (e) { return null; }
}
function save() {
  if (!cryptoKey) return saveQueue;
  const key = cryptoKey, meta = keyMeta, json = JSON.stringify(db);
  saveQueue = saveQueue.then(() => writeRecord(key, meta, json)).catch(e => alert('保存できませんでした: ' + e.message));
  return saveQueue;
}
async function setPin(pin, data) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(pin, salt, PBKDF2_ITER);
  keyMeta = { salt, iter: PBKDF2_ITER };
  db = data;
  await save();
}
function pinProblem(pin) {
  if (pin.length < 6) return '6文字以上にしてください';
  if (!/^[\x21-\x7e]+$/.test(pin)) return '使えるのは半角の英字・数字・記号です（空白や日本語は使えません）';
  const asc = '01234567890123456789', desc = '98765432109876543210';
  if (/^(.)\1+$/.test(pin) || asc.includes(pin) || desc.includes(pin)) return '同じ文字の繰り返しや連番は使えません';
  return '';
}
const dateStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function rollDay() { if (db.today.date !== dateStr()) { db.today = { date: dateStr(), checked: [], order: null, manual: false }; save(); } }

const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const label = c => c.name || c.address;

const hasPos = p => p && Number.isFinite(p.lat) && Number.isFinite(p.lng);

/* ========== Googleマップのリンク ========== */
function mapUrl(origin, dest, ways) {
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving';
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  u += '&destination=' + encodeURIComponent(dest);
  if (ways.length) u += '&waypoints=' + encodeURIComponent(ways.join('|'));
  return u;
}
function buildLinks(addresses, start, end, maxWp) {  // 上限を超えないよう区間に分ける（順番は変えない）
  const pts = end ? [...addresses, end] : addresses.slice(), links = [];
  let origin = start || null, i = 0;
  while (i < pts.length) {
    let take = Math.min(maxWp + 1, pts.length - i);
    while (take > 1 && mapUrl(origin, pts[i + take - 1], pts.slice(i, i + take - 1)).length > MAX_URL) take--;
    const dest = pts[i + take - 1];
    links.push({ url: mapUrl(origin, dest, pts.slice(i, i + take - 1)), from: i + 1, to: Math.min(i + take, addresses.length), homeOnly: i >= addresses.length });
    origin = dest; i += take;
  }
  return links;
}

const z2h = s => String(s).replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));

/* ========== Googleの住所チェック（APIキーを設定したときだけ動く。送るのは住所のみ） ========== */
let geocoderReady = null, gChecking = '', gmAuthFailed = false;
window.gm_authFailure = () => { gmAuthFailed = true; };
function loadGeocoder() {
  if (geocoderReady) return geocoderReady;
  geocoderReady = new Promise((resolve, reject) => {
    window.gmReady = () => resolve(new google.maps.Geocoder());
    const el = document.createElement('script');
    el.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(db.settings.mapsKey) + '&language=ja&region=JP&v=weekly&libraries=geocoding&loading=async&callback=gmReady';
    el.async = true;
    el.onerror = () => { geocoderReady = null; reject(new Error('Googleに接続できませんでした')); };
    document.head.appendChild(el);
  });
  return geocoderReady;
}
function gcheckError(code) {
  return { REQUEST_DENIED: 'APIキーの設定を確認してください', OVER_QUERY_LIMIT: '利用回数の上限に達しました', OVER_DAILY_LIMIT: '利用回数の上限に達しました' }[code] || `Googleから応答がありませんでした（${code || '通信エラー'}）`;
}
async function checkAddress(address) {            // none:見つからない partial:要確認 ok:問題なし
  const geocoder = await loadGeocoder();
  let results = [];
  try {
    results = (await geocoder.geocode({ address, region: 'JP' })).results || [];
  } catch (e) {
    if (e && e.code !== 'ZERO_RESULTS') throw new Error(gcheckError(e.code));
  }
  if (gmAuthFailed) throw new Error(gcheckError('REQUEST_DENIED'));
  const r = results[0];
  if (!r) return { for: address, status: 'none', google: '' };
  const rough = r.partial_match || (r.geometry && r.geometry.location_type === 'APPROXIMATE');
  return { for: address, status: rough ? 'partial' : 'ok', google: r.formatted_address || '' };
}
const checkOf = c => (c.check && c.check.for === c.address ? c.check : null);
const needsCheck = c => !!db.settings.mapsKey && !c.manualPos && !checkOf(c);
function checkMessage(c) {
  const k = checkOf(c);
  if (!k || c.manualPos || k.status === 'ok') return '';
  return k.status === 'none' ? 'Googleで見つかりません' : `一部だけ一致（Googleの認識：${k.google}）`;
}
const checkNote = c => { const m = checkMessage(c); return m ? `<span class="ng">⚠ ${h(m)}</span>` : ''; };
async function checkOne(c) {                      // 登録・変更した1件を確認し、問題があれば知らせる
  const sess = lockSession;
  try {
    const k = await checkAddress(c.address);
    if (sess !== lockSession) return;
    c.check = k; save(); render();
    if (k.status !== 'ok') alert(`${label(c)}\n${checkMessage(c)}`);
  } catch (e) { if (sess === lockSession) alert('住所チェックができませんでした：' + e.message); }
}
async function checkUnchecked() {                 // 未確認の住所をまとめて確認する
  const sess = lockSession, list = db.customers.filter(needsCheck);
  for (let i = 0; i < list.length; i++) {
    if (sess !== lockSession) return;
    gChecking = `確認中 ${i + 1}/${list.length}`; if (tab === 'list') renderList();
    try {
      const k = await checkAddress(list[i].address);
      if (sess !== lockSession) return;
      list[i].check = k; save();
    } catch (e) { gChecking = ''; renderList(); alert('住所チェックを止めました：' + e.message); return; }
    await new Promise(r => setTimeout(r, 100));
  }
  gChecking = '';
  if (tab === 'list') renderList();
  const ng = db.customers.filter(c => checkMessage(c)).length;
  alert(ng ? `確認が必要な住所が${ng}件あります。顧客リストの赤い表示を確認してください。` : '確認した住所に問題は見つかりませんでした。');
}

/* ========== CSV ========== */
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  const delim = /\t/.test(text.split('\n')[0]) ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function toCustomers(rows) {
  if (!rows.length) return [];
  const width = rows[0].length;
  let col = width >= 3 ? { no: 0, name: 1, address: 2, lat: 3, lng: 4, manual: 5 }
    : width === 2 ? { no: 0, name: -1, address: 1, lat: -1, lng: -1, manual: -1 }
      : { no: -1, name: -1, address: 0, lat: -1, lng: -1, manual: -1 };
  const head = rows[0].map(c => c.replace(/^\uFEFF/, ''));
  if (head.some(c => c.includes('住所'))) {
    const f = re => head.findIndex(c => re.test(c));
    col = { no: f(/番号|順番|No/i), name: f(/名前|氏名/), address: f(/住所/), lat: f(/緯度/), lng: f(/経度/), manual: f(/位置指定/) };
    rows = rows.slice(1);
  }
  const list = rows.map((r, i) => {
    const lat = parseFloat(r[col.lat]), lng = parseFloat(r[col.lng]), manual = r[col.manual] === '1' && Number.isFinite(lat) && Number.isFinite(lng);
    return { id: uid() + i, name: col.name >= 0 ? (r[col.name] || '') : '', address: r[col.address] || '', lat: manual ? lat : null, lng: manual ? lng : null, manualPos: manual, rank: parseInt(z2h(r[col.no] ?? ''), 10) };
  }).filter(c => c.address);
  if (list.every(c => Number.isFinite(c.rank))) list.sort((a, b) => a.rank - b.rank);   // 順番の列があればその順に並べる
  list.forEach(c => delete c.rank);
  return list;
}
function decodeFile(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('shift_jis').decode(buf); }      // Excelの標準CSV
}
function exportCsv() {
  if (!confirm('CSVファイルは暗号化されず、名前と住所をそのまま読めます。保存しますか？\n保存先は安全な場所1か所にし、不要になったファイルは消してください。')) return;
  const q = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : (v ?? '');
  const lines = [['順番', '名前', '住所', '緯度', '経度', '位置指定'], ...db.customers.map((c, i) => c.manualPos ? [i + 1, c.name, c.address, c.lat, c.lng, 1] : [i + 1, c.name, c.address, '', '', ''])].map(r => r.map(q).join(','));
  const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `顧客リスト_${dateStr()}.csv` });
  a.click(); URL.revokeObjectURL(url);
}

/* ========== 画面 ========== */
const view = document.getElementById('view'), bottom = document.getElementById('bottom'), makeBtn = document.getElementById('makeRoute');
let tab = 'check', query = '', onlyChecked = false;

function show(t) { tab = t; render(); window.scrollTo(0, 0); }
function render() {
  if (!cryptoKey) return;
  rollDay();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ check: renderCheck, route: renderRoute, list: renderList, set: renderSet })[tab]();
  updateBottom();
}
function updateBottom() {
  const n = db.today.checked.length;
  bottom.hidden = tab !== 'check' || !db.customers.length;
  makeBtn.textContent = `ルートを見る（${n}件）`;
  makeBtn.disabled = !n;
}

function renderCheck() {
  if (!db.customers.length) { view.innerHTML = `<div class="empty">顧客が登録されていません。<br><button class="primary" data-go="list">顧客リストを登録する</button></div>`; return; }
  view.innerHTML = `
    <div class="row-line"><input type="search" id="q" placeholder="順番・名前・住所で絞り込み" value="${h(query)}"></div>
    <div class="row-line">
      <label class="muted"><input type="checkbox" id="only" ${onlyChecked ? 'checked' : ''}> チェック済みだけ表示</label>
      <span class="grow"></span><button id="clear">全部外す</button>
    </div>
    <div id="rows"></div>`;
  drawRows();
  document.getElementById('q').oninput = e => { query = e.target.value; drawRows(); };
  document.getElementById('only').onchange = e => { onlyChecked = e.target.checked; drawRows(); };
  document.getElementById('clear').onclick = () => { if (confirm('今日のチェックをすべて外しますか？')) { setChecked([]); drawRows(); updateBottom(); } };
}
function setChecked(ids) { db.today.checked = ids; save(); }
function drawRows() {
  const q = query.trim().toLowerCase(), ck = new Set(db.today.checked);
  const pos = new Map(db.customers.map((c, i) => [c.id, i + 1]));
  const rows = db.customers.filter(c => (!onlyChecked || ck.has(c.id)) && (!q || `${pos.get(c.id)} ${c.name} ${c.address}`.toLowerCase().includes(q)));
  document.getElementById('rows').innerHTML = rows.map(c => `
    <label class="cust ${ck.has(c.id) ? 'on' : ''}">
      <input type="checkbox" data-ck="${h(c.id)}" ${ck.has(c.id) ? 'checked' : ''}>
      <span class="no">${pos.get(c.id)}</span>
      <span class="grow">${c.name ? h(c.name) + '<br>' : ''}<span class="addr">${h(c.address)}</span></span>
    </label>`).join('') || '<div class="empty">該当なし</div>';
}

const byId = id => db.customers.find(c => c.id === id);
function baseIds() {                              // チェックした人をリストの順に並べたもの
  const ck = new Set(db.today.checked);
  return db.customers.filter(c => ck.has(c.id)).map(c => c.id);
}
function routeIds() {                             // 入れ替えた順番を保ったまま、追加分をリスト順の位置に差し込む
  const base = baseIds();
  if (!db.today.manual || !db.today.order) return base;
  const ck = new Set(base), ids = db.today.order.filter(id => ck.has(id));
  base.forEach((id, i) => { if (!ids.includes(id)) ids.splice(i ? ids.indexOf(base[i - 1]) + 1 : 0, 0, id); });
  return ids;
}
function setRoute(ids) {
  const base = baseIds(), same = ids.every((id, i) => id === base[i]);
  db.today.order = same ? null : ids; db.today.manual = !same;
  save(); renderRoute();
}
function renderRoute() {
  const stops = routeIds().map(byId).filter(Boolean), s = db.settings, end = s.sameEnd ? s.start : s.end;
  if (!stops.length) {
    view.innerHTML = `<div class="empty">チェック画面で今日のお客様を選んでください。<br><br><button class="primary" data-go="check">チェックへ</button></div>`;
    return;
  }
  const links = buildLinks(stops.map(c => c.manualPos && hasPos(c) ? `${c.lat},${c.lng}` : c.address), s.start, end, s.maxWp);
  const ng = stops.filter(c => checkMessage(c));
  view.innerHTML = `
    ${ng.length ? `<div class="card warn"><b>地図に正しく出ない可能性がある住所（${ng.length}件）</b><ul>${ng.map(c => `<li>${h(label(c))}：${h(checkMessage(c))}</li>`).join('')}</ul></div>` : ''}
    ${s.start ? '' : '<div class="card warn">出発地が未設定なので、地図は現在地から始まります。<button data-go="set">設定する</button></div>'}
    <h2>今日のルート（${stops.length}件）</h2>
    <div class="card">${links.map((l, i) => `
      <a class="primary" href="${h(l.url)}" target="_blank" rel="noopener noreferrer">${links.length > 1 ? `区間${i + 1}：` : ''}${l.homeOnly ? '帰着地まで' : `${l.from}〜${l.to}軒目`}をGoogleマップで開く</a>`).join('')}
      ${links.length > 1 ? `<p class="muted">Googleマップの上限のため${links.length}区間に分かれています。区間を走り終えたら次のボタンを押してください。</p>` : ''}
    </div>
    ${db.today.manual ? '<div class="card"><b>今日だけ順番を入れ替え中</b><div class="row-line"><button data-act="useBase">いつもの順に戻す</button></div></div>' : ''}
    <p class="muted">≡ を押したまま上下に動かすと、順番を入れ替えられます。</p>
    <div class="card" id="stopRows" data-list="route">${stops.map((c, i) => `
      <div class="stop dragitem">
        <span class="drag" aria-label="ドラッグして移動">≡</span>
        <span class="idx">${i + 1}</span>
        <span class="grow"><b>${h(label(c))}</b>${c.name ? `<br><span class="addr">${h(c.address)}</span>` : ''}${checkNote(c)}</span>
        <button class="mv" data-up="${i}" ${i ? '' : 'disabled'} aria-label="上へ">↑</button>
        <button class="mv" data-down="${i}" ${i < stops.length - 1 ? '' : 'disabled'} aria-label="下へ">↓</button>
      </div>`).join('')}</div>`;
}
function moved(list, from, to) {
  const out = list.slice(), [x] = out.splice(from, 1);
  out.splice(to, 0, x);
  return out;
}
function moveStop(i, d) { setRoute(moved(routeIds(), i, i + d)); }
function applyDrag(list, from, to) {
  if (list === 'route') setRoute(moved(routeIds(), from, to));
  else { db.customers = moved(db.customers, from, to); save(); renderList(); }
}
function renderList() {
  const unchecked = db.customers.filter(needsCheck).length;
  view.innerHTML = `
    <p class="muted">上から順が「いつもの順」です。≡ を押したまま動かすか、番号を書き換えると並べ替えられます。</p>
    <div class="row-line"><button class="primary" data-act="add">＋ 顧客を追加</button><button data-act="import">まとめて登録</button>${db.settings.mapsKey ? `<button data-act="gCheck" ${gChecking || !unchecked ? 'disabled' : ''}>${gChecking ? h(gChecking) : `Googleで住所チェック（未確認${unchecked}件）`}</button>` : ''}<button data-act="export" ${db.customers.length ? '' : 'disabled'}>CSVに保存</button></div>
    <div id="custRows" data-list="customers">${db.customers.map((c, i) => `
      <div class="cust dragitem" style="cursor:default">
        <span class="drag" aria-label="ドラッグして移動">≡</span>
        <input class="pos" type="number" min="1" max="${db.customers.length}" value="${i + 1}" data-pos="${i}" aria-label="順番">
        <span class="grow"><b>${h(label(c))}</b>${c.name ? `<br><span class="addr">${h(c.address)}</span>` : ''}${checkNote(c)}</span>
        <button data-edit="${h(c.id)}">編集</button>
      </div>`).join('') || '<div class="empty">まだ登録がありません</div>'}</div>`;
}
function editDialog(c) {
  const isNew = !c; c = c || { id: uid(), name: '', address: '' };
  const others = db.customers.filter(x => x !== c), myIndex = db.customers.indexOf(c);
  const afterId = isNew ? (others.length ? others[others.length - 1].id : '') : (myIndex > 0 ? db.customers[myIndex - 1].id : '');
  const coords = hasPos(c) ? `${c.lat}, ${c.lng}` : '';
  dlgForm.innerHTML = `
    <h3 style="margin:0">${isNew ? '顧客を追加' : '顧客を編集'}</h3>
    <label class="f">名前（省略可）<input type="text" id="fName" value="${h(c.name)}"></label>
    <label class="f">住所<input type="text" id="fAddr" value="${h(c.address)}" placeholder="例：大阪府大阪市北区中之島1-3-20"></label>
    <label class="f">配達の順番（選んだ人の次に入ります）
      <select id="fAfter"><option value="">一番最初</option>${others.map((x, i) => `<option value="${h(x.id)}" ${x.id === afterId ? 'selected' : ''}>${i + 1}. ${h(label(x))} の次</option>`).join('')}</select></label>
    <p class="muted" id="fBetween"></p>
    <label class="f">緯度, 経度（Googleマップで住所が出ないときだけ。地点を長押しすると表示されます。入れると地図はこの地点を案内します）
      <input type="text" id="fPos" value="${h(c.manualPos ? coords : '')}" placeholder="例: 34.6938, 135.5012"></label>
    <div class="row-line"><button class="primary" value="ok">保存</button><button value="cancel" formnovalidate>やめる</button>${isNew ? '' : '<button class="danger" value="del">削除</button>'}</div>`;
  const showBetween = () => {
    const i = others.findIndex(x => x.id === fAfter.value), a = others[i], b = others[i + 1];
    fBetween.textContent = !others.length ? '' : a && b ? `→ ${label(a)} と ${label(b)} の間` : a ? `→ ${label(a)} の次（一番最後）` : `→ ${label(others[0])} の前（一番最初）`;
  };
  fAfter.onchange = showBetween; showBetween();
  dlg.returnValue = '';
  dlg.onclose = () => {
    if (dlg.returnValue === 'del') {
      if (!confirm(`${label(c)} を削除しますか？`)) return;
      db.customers = db.customers.filter(x => x !== c);
      setChecked(db.today.checked.filter(id => id !== c.id));
    } else if (dlg.returnValue === 'ok') {
      const address = fAddr.value.trim();
      if (!address) { alert('住所を入力してください'); return; }
      const m = fPos.value.match(/(-?\d+(?:\.\d+)?)\s*[,、\s]\s*(-?\d+(?:\.\d+)?)/);
      const posText = fPos.value.trim();
      if (posText && !m) { alert('緯度, 経度の形式が読み取れないため、位置は保存しませんでした'); }
      Object.assign(c, { name: fName.value.trim(), address });
      Object.assign(c, m ? { lat: +m[1], lng: +m[2], manualPos: true } : { lat: null, lng: null, manualPos: false });
      const rest = others.slice(), at = fAfter.value ? rest.findIndex(x => x.id === fAfter.value) + 1 : 0;
      rest.splice(at, 0, c);
      db.customers = rest;
      save();
      if (needsCheck(c)) checkOne(c);
    } else return;
    render();
  };
  dlg.showModal();
}
function importDialog() {
  dlgForm.innerHTML = `
    <h3 style="margin:0">まとめて登録</h3>
    <p class="muted">Excelからの貼り付けか、CSVファイルで登録できます。順番の列があればその順に、なければ行の順に並びます。<br>列：順番, 名前, 住所（「順番, 住所」や住所だけでも可）</p>
    <textarea id="fCsv" rows="8" placeholder="1,山田,大阪府大阪市…&#10;2,佐藤,大阪府大阪市…"></textarea>
    <div class="row-line"><input type="file" id="fFile" accept=".csv,.txt,text/csv"></div>
    <p class="muted" style="color:var(--bad)">今の顧客リストは置き換えられ、今日のチェックも外れます。</p>
    <div class="row-line"><button class="primary" value="ok">登録</button><button value="cancel">やめる</button></div>`;
  fFile.onchange = async () => { if (fFile.files[0]) fCsv.value = decodeFile(await fFile.files[0].arrayBuffer()); };
  dlg.returnValue = '';
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok') return;
    const list = toCustomers(parseCsv(fCsv.value));
    if (!list.length) { alert('読み取れる行がありませんでした。列の形式を確認してください。'); return; }
    if (db.customers.length && !confirm(`今の${db.customers.length}件を、${list.length}件で置き換えますか？`)) return;
    db.customers = list; setChecked([]); render();
    alert(`${list.length}件を登録しました`);
  };
  dlg.showModal();
}

function renderSet() {
  const s = db.settings;
  view.innerHTML = `
    <h2>ルート</h2>
    <label class="f">出発地（営業所など）<input type="text" id="sStart" value="${h(s.start)}" placeholder="住所を入力"></label>
    <label class="f"><input type="checkbox" id="sSame" ${s.sameEnd ? 'checked' : ''}> 出発地に戻る</label>
    <label class="f" id="endWrap" ${s.sameEnd ? 'hidden' : ''}>帰着地（空なら最後の配達先で終了）<input type="text" id="sEnd" value="${h(s.end)}"></label>
    <label class="f">1区間に入れる経由地の数
      <select id="sWp"><option value="9" ${s.maxWp == 9 ? 'selected' : ''}>9件（アプリで開く場合）</option><option value="3" ${s.maxWp == 3 ? 'selected' : ''}>3件（スマホのブラウザで開く場合）</option></select></label>
    <h2>Googleの住所チェック</h2>
    <label class="f">Google APIキー（空なら住所チェックはしません）
      <input type="password" id="sKey" value="${h(s.mapsKey)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <p class="muted">キーはこの端末にPINで暗号化して保存され、公開サイトには含まれません。</p>
    <h2>セキュリティ</h2>
    <label class="f">操作しないとロックするまでの時間
      <select id="sLock">${[5, 15, 30, 60].map(m => `<option value="${m}" ${s.autoLockMin == m ? 'selected' : ''}>${m}分</option>`).join('')}</select></label>
    <div class="row-line"><button data-act="lockNow">今すぐロック</button><button data-act="changePin">PINを変更</button></div>
    <h2>個人情報の扱い</h2>
    <div class="card muted">
      顧客データと設定は、この端末のブラウザ内にPINで暗号化して保存されます。<br>
      住所は地図表示と住所チェックのためGoogleへ送られます。名前は送信しません。APIキーを設定すると、住所チェックのときにGoogleのプログラムを読み込みます。<br>
      ブラウザのデータを消すとリストも消え、PINを忘れると元に戻せません。顧客画面の「CSVに保存」で控えを1つ、安全な場所に保管してください。
    </div>
    <h2>データ</h2>
    <button class="danger" data-act="wipe">この端末のデータをすべて消す</button>`;
  const saveS = () => { s.start = sStart.value.trim(); s.sameEnd = sSame.checked; s.end = sEnd.value.trim(); s.maxWp = +sWp.value; s.autoLockMin = +sLock.value;
    const key = sKey.value.trim(), keyChanged = key !== s.mapsKey;
    s.mapsKey = key; save();
    if (keyChanged && geocoderReady) alert('新しいキーを使うには、ページを読み込み直してください'); endWrap.hidden = s.sameEnd; };
  [sStart, sSame, sEnd, sWp, sLock, sKey].forEach(el => el.onchange = saveS);
}
function changePinDialog() {
  dlgForm.innerHTML = `
    <h3 style="margin:0">PINを変更</h3>
    <label class="f">今のPIN<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pOld"></label>
    <label class="f">新しいPIN（6文字以上の英字・数字・記号）<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pNew"></label>
    <label class="f">新しいPIN（確認）<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pNew2"></label>
    <div class="row-line"><button class="primary" value="ok">変更</button><button value="cancel">やめる</button></div>`;
  dlg.returnValue = '';
  dlg.onclose = async () => {
    if (dlg.returnValue !== 'ok') return;
    const oldPin = pOld.value, pin = pNew.value, problem = pinProblem(pin);
    if (problem) { alert(problem); return; }
    if (pin !== pNew2.value) { alert('新しいPINが一致しません'); return; }
    await saveQueue;
    if (!await openRecord(oldPin)) { alert('今のPINが違います'); return; }
    await setPin(pin, db);
    alert('PINを変更しました');
  };
  dlg.showModal();
}

/* ========== ロック画面 ========== */
const gate = document.getElementById('gate');
function readFails() { try { return JSON.parse(localStorage.getItem(KEY_FAIL)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function afterUnlock() {
  gate.innerHTML = '';
  document.body.classList.remove('locked');
  lastActive = Date.now();
  if (db.customers.some(c => 'no' in c)) {        // 旧版の番号を順番として取り込み、番号欄を廃止
    const rank = c => { const n = parseInt(z2h(c.no ?? ''), 10); return Number.isFinite(n) ? n : Infinity; };
    db.customers = db.customers.map((c, i) => ({ c, i })).sort((a, b) => rank(a.c) - rank(b.c) || a.i - b.i).map(x => x.c);
    db.customers.forEach(c => { delete c.no; delete c.geoFor; delete c.geoV; delete c.geoTitle; if (!c.manualPos) { c.lat = null; c.lng = null; } });
    db.today.order = null; db.today.manual = false;
    save();
  }
  rollDay();
  tab = db.today.checked.length ? 'route' : 'check';
  render();
}
function showGate(mode) {
  document.body.classList.add('locked');
  const setup = mode === 'setup', migrating = setup && !!readV1();
  gate.innerHTML = `<form id="gForm">
    <h1>${setup ? 'PINを決めてください' : '配達ルート'}</h1>
    <p class="muted">${setup ? `6文字以上で決めてください。英字（大文字・小文字）、数字、記号が使えます。長いほど安全で、8文字以上がおすすめです。顧客データはこのPINで暗号化されます。<br><b>PINを忘れるとデータは元に戻せません。</b>${migrating ? '<br>登録済みのデータは暗号化して引き継ぎます。' : ''}` : 'PINを入力してください'}</p>
    <input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="gPin" aria-label="PIN" autofocus>
    ${setup ? '<p class="muted">確認のためもう一度</p><input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="gPin2" aria-label="PIN確認">' : ''}
    <label class="muted"><input type="checkbox" id="gShow" style="width:auto"> 入力を表示</label>
    <p class="err" id="gErr" role="alert"></p>
    <button class="primary" id="gOk">${setup ? 'このPINで始める' : 'ロック解除'}</button>
    ${setup ? '' : '<button type="button" class="link" id="gForgot">PINを忘れた</button>'}
  </form>`;
  const err = document.getElementById('gErr'), ok = document.getElementById('gOk'), pinEl = document.getElementById('gPin');
  document.getElementById('gShow').onchange = e => {
    gate.querySelectorAll('#gPin,#gPin2').forEach(el => { el.type = e.target.checked ? 'text' : 'password'; });
  };
  document.getElementById('gForm').onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    const pin = pinEl.value;
    ok.disabled = true;
    try {
      if (setup) {
        const problem = pinProblem(pin);
        if (problem) { err.textContent = problem; return; }
        if (pin !== document.getElementById('gPin2').value) { err.textContent = 'PINが一致しません'; return; }
        await setPin(pin, readV1() || blank());
        localStorage.removeItem(KEY_V1);
        afterUnlock();
        return;
      }
      const f = readFails();
      if (Date.now() < f.until) { err.textContent = `入力を間違えすぎました。あと${Math.ceil((f.until - Date.now()) / 1000)}秒待ってください`; return; }
      const opened = await openRecord(pin);
      if (!opened) {
        f.n++;
        if (f.n >= 5) f.until = Date.now() + Math.min(30000 * 2 ** (f.n - 5), 3600000);
        localStorage.setItem(KEY_FAIL, JSON.stringify(f));
        pinEl.value = '';
        err.textContent = 'PINが違います';
        return;
      }
      localStorage.removeItem(KEY_FAIL);
      cryptoKey = opened.key; keyMeta = opened.meta; db = opened.data;
      afterUnlock();
    } finally { ok.disabled = false; }
  };
  const forgot = document.getElementById('gForgot');
  if (forgot) forgot.onclick = () => {
    if (prompt('PINが分からないとデータは読めません。\nこの端末の顧客データをすべて消して最初からやり直す場合は「削除」と入力してください。') !== '削除') return;
    wipeAll();
  };
}
function lock() {
  if (!cryptoKey) return;
  lockSession++;
  cryptoKey = null; keyMeta = null; db = blank(); query = ''; gChecking = '';
  if (dlg.open) dlg.close('cancel');
  view.innerHTML = '';
  showGate('unlock');
}
function wipeAll() {
  lockSession++;
  cryptoKey = null; keyMeta = null; db = blank(); query = ''; gChecking = ''; view.innerHTML = '';
  [KEY_ENC, KEY_FAIL, KEY_V1].forEach(k => localStorage.removeItem(k));
  showGate('setup');
}
function checkIdle() {
  if (cryptoKey && Date.now() - lastActive > db.settings.autoLockMin * 60000) lock();
}
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkIdle(); });
setInterval(checkIdle, 30000);

const dlg = document.getElementById('dlg'), dlgForm = document.getElementById('dlgForm');
document.getElementById('tabs').onclick = e => { const t = e.target.dataset.tab; if (t) show(t); };
makeBtn.onclick = () => show('route');
view.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ck) {
    const set = new Set(db.today.checked);
    t.checked ? set.add(t.dataset.ck) : set.delete(t.dataset.ck);
    setChecked([...set]);
    t.closest('.cust').classList.toggle('on', t.checked);
    if (onlyChecked && !t.checked) drawRows();
    updateBottom();
  }
  if (t.dataset.pos !== undefined) {
    const from = +t.dataset.pos, to = Math.min(Math.max(+t.value || 1, 1), db.customers.length) - 1;
    const [c] = db.customers.splice(from, 1); db.customers.splice(to, 0, c);
    save(); renderList();
  }
});
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) show(d.go);
  if (d.edit) editDialog(byId(d.edit));
  if (d.up) moveStop(+d.up, -1);
  if (d.down) moveStop(+d.down, 1);
  if (d.act === 'add') editDialog();
  if (d.act === 'import') importDialog();
  if (d.act === 'export') exportCsv();
  if (d.act === 'useBase') { db.today.order = null; db.today.manual = false; save(); renderRoute(); }
  if (d.act === 'gCheck') checkUnchecked();
  if (d.act === 'lockNow') lock();
  if (d.act === 'changePin') changePinDialog();
  if (d.act === 'wipe' && confirm('顧客リストと設定をすべて消します。よろしいですか？')) wipeAll();
});
view.addEventListener('pointerdown', e => {      // ≡ を押したまま動かして並べ替える
  const handle = e.target.closest('.drag'); if (!handle) return;
  e.preventDefault();
  const item = handle.closest('.dragitem'), box = item.parentElement, from = [...box.children].indexOf(item);
  let y = e.clientY, done = false;
  item.classList.add('dragging');
  view.setPointerCapture(e.pointerId);
  const place = () => {
    const before = [...box.children].filter(x => x !== item).find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
    if (item.nextElementSibling !== before) box.insertBefore(item, before);
    [...box.children].forEach((el, i) => {
      const n = el.querySelector('.idx'), p = el.querySelector('.pos');
      if (n) n.textContent = i + 1;
      if (p) p.value = i + 1;
    });
  };
  const onMove = ev => { if (ev.pointerId === e.pointerId) { y = ev.clientY; place(); } };
  const scroller = setInterval(() => {
    const d = y < 80 ? -14 : y > innerHeight - 70 ? 14 : 0;
    if (d) { window.scrollBy(0, d); place(); }
  }, 30);
  const onEnd = ev => {
    if (done || ev.pointerId !== e.pointerId) return;
    done = true;
    clearInterval(scroller);
    view.removeEventListener('pointermove', onMove); view.removeEventListener('pointerup', onEnd); view.removeEventListener('pointercancel', onEnd);
    item.classList.remove('dragging');
    const to = [...box.children].indexOf(item);
    if (ev.type === 'pointerup' && to !== from) applyDrag(box.dataset.list, from, to); else render();
  };
  view.addEventListener('pointermove', onMove); view.addEventListener('pointerup', onEnd); view.addEventListener('pointercancel', onEnd);
});
if (!window.crypto || !crypto.subtle) {
  gate.innerHTML = '<div class="empty">この開き方では暗号化が使えません。https:// のURLから開いてください。</div>';
} else {
  showGate(readRecord() ? 'unlock' : 'setup');
}
</script>
