<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:150px}

<body class="locked">
<section id="gate"></section>

  <button data-tab="check">チェック</button>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
'use strict';
/* ========== データ保存（この端末のブラウザ内に、PINで暗号化して保存） ========== */
const KEY_V1 = 'yoshikei-route-v1';              // 暗号化前の形式（移行のためだけに読む）
const KEY_ENC = 'yoshikei-route-enc-v2';
const KEY_FAIL = 'yoshikei-route-fails';
const PBKDF2_ITER = 600000;
const MIN_SAVE_KM = 0.2, MIN_SAVE_RATE = 0.03;   // これ未満の短縮は提案しない
const MAX_URL = 2000;                            // Googleの上限2048文字に余裕を持たせる
const FAR_KM = 60;

const blank = () => ({
  customers: [],
  settings: { start: '', end: '', sameEnd: true, maxWp: 9, startGeo: null, endGeo: null, autoLockMin: 15 },
  today: { date: '', checked: [], order: null }
});
const withDefaults = d => ({ ...blank(), ...d, settings: { ...blank().settings, ...d.settings } });
function readV1() {
  try { const d = JSON.parse(localStorage.getItem(KEY_V1)); return d && d.customers ? withDefaults(d) : null; }
  catch (e) { return null; }
}
let db = blank(), cryptoKey = null, keyMeta = null, lockSession = 0, lastActive = Date.now(), saveQueue = Promise.resolve();

const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt, iter) {
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, raw,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function writeRecord(key, meta, json) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(json));
  localStorage.setItem(KEY_ENC, JSON.stringify({ v: 2, salt: toB64(meta.salt), iter: meta.iter, iv: toB64(iv), ct: toB64(ct) }));
}
function readRecord() {
  try { return JSON.parse(localStorage.getItem(KEY_ENC)); } catch (e) { return null; }
}
async function openRecord(pin) {                  // PINが違うとnullを返す
  const rec = readRecord(), salt = fromB64(rec.salt), key = await deriveKey(pin, salt, rec.iter);
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(rec.iv) }, key, fromB64(rec.ct));
    return { key, meta: { salt, iter: rec.iter }, data: withDefaults(JSON.parse(new TextDecoder().decode(plain))) };
  } catch (e) { return null; }
}
function save() {
  if (!cryptoKey) return saveQueue;
  const key = cryptoKey, meta = keyMeta, json = JSON.stringify(db);
  saveQueue = saveQueue.then(() => writeRecord(key, meta, json)).catch(e => alert('保存できませんでした: ' + e.message));
  return saveQueue;
}
async function setPin(pin, data) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(pin, salt, PBKDF2_ITER);
  keyMeta = { salt, iter: PBKDF2_ITER };
  db = data;
  await save();
}
function pinProblem(pin) {
  if (pin.length < 6) return '6文字以上にしてください';
  if (!/^[\x21-\x7e]+$/.test(pin)) return '使えるのは半角の英字・数字・記号です（空白や日本語は使えません）';
  const asc = '01234567890123456789', desc = '98765432109876543210';
  if (/^(.)\1+$/.test(pin) || asc.includes(pin) || desc.includes(pin)) return '同じ文字の繰り返しや連番は使えません';
  return '';
}
const dateStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function rollDay() { if (db.today.date !== dateStr()) { db.today = { date: dateStr(), checked: [], order: null }; save(); } }

const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const label = c => `No.${c.no}${c.name ? ' ' + c.name : ''}`;
const km = v => v.toFixed(1) + 'km';

/* ========== 距離と順番の計算 ========== */
const hasPos = p => p && Number.isFinite(p.lat) && Number.isFinite(p.lng);
function dist(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function routeLen(seq, start, end) {
  let t = 0;
  if (seq.length && start) t += dist(start, seq[0]);
  for (let i = 1; i < seq.length; i++) t += dist(seq[i - 1], seq[i]);
  if (seq.length && end) t += dist(seq[seq.length - 1], end);
  return t;
}
function nearestFirst(seq, start) {
  const rest = seq.slice(), out = [];
  let cur = start || rest.shift();
  if (!start) out.push(cur);
  while (rest.length) {
    let bi = 0, bd = Infinity;
    rest.forEach((p, i) => { const d = dist(cur, p); if (d < bd) { bd = d; bi = i; } });
    cur = rest.splice(bi, 1)[0]; out.push(cur);
  }
  return out;
}
function improve(seq, start, end) {           // 区間反転と移動を、縮まなくなるまで繰り返す
  let best = seq.slice(), bestLen = routeLen(best, start, end);
  const n = best.length;
  for (let loop = 0, changed = true; changed && loop < 100; loop++) {
    changed = false;
    for (let i = 0; i < n - 1; i++) for (let j = i + 1; j < n; j++) {
      const t = [...best.slice(0, i), ...best.slice(i, j + 1).reverse(), ...best.slice(j + 1)];
      const l = routeLen(t, start, end);
      if (l < bestLen - 1e-9) { best = t; bestLen = l; changed = true; }
    }
    for (let size = 1; size <= 3; size++) for (let i = 0; i + size <= n; i++) {
      const block = best.slice(i, i + size), others = [...best.slice(0, i), ...best.slice(i + size)];
      for (let k = 0; k <= others.length; k++) {
        if (k === i) continue;
        const t = [...others.slice(0, k), ...block, ...others.slice(k)];
        const l = routeLen(t, start, end);
        if (l < bestLen - 1e-9) { best = t; bestLen = l; changed = true; break; }
      }
      if (changed) break;
    }
  }
  return best;
}
function optimize(seq, start, end) {
  if (seq.length < 3 && !(seq.length === 2 && (start || end))) return seq.slice();
  const seeds = [seq, nearestFirst(seq, start), seq.slice().reverse()];
  return seeds.map(s => improve(s, start, end))
    .reduce((a, b) => routeLen(b, start, end) < routeLen(a, start, end) - 1e-9 ? b : a);
}
function neighbors(seq, i, start, end) {
  return [i ? seq[i - 1] : start, i < seq.length - 1 ? seq[i + 1] : end];
}
function detourOf(prev, x, next) {
  if (prev && next) return dist(prev, x) + dist(x, next) - dist(prev, next);
  return prev ? dist(prev, x) : next ? dist(x, next) : 0;
}
function ptName(p, start, end) {
  if (!p) return '';
  if (p === start) return '出発地';
  if (p === end) return '帰着地';
  return `No.${p.no}`;
}
function explain(base, prop, start, end) {         // 提案の理由を文章にする
  const out = [], same = (a, b) => a === b;
  if (base.length > 2 && base.every((c, i) => same(c, prop[prop.length - 1 - i]))) {
    out.push('同じ道筋を逆回りにする提案です。出発地・帰着地への距離の関係で短くなります。');
  }
  const edge = (seq, s, e) => {
    const pts = [...(s ? [s] : []), ...seq, ...(e ? [e] : [])], list = [];
    for (let i = 1; i < pts.length; i++) list.push([pts[i - 1], pts[i], dist(pts[i - 1], pts[i])]);
    return list;
  };
  const propEdges = edge(prop, start, end);
  const kept = ([a, b]) => propEdges.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  const longest = edge(base, start, end).filter(e => !kept(e)).sort((a, b) => b[2] - a[2])[0];
  if (longest) out.push(`いつもの順にある長い移動「${ptName(longest[0], start, end)}→${ptName(longest[1], start, end)}」（約${km(longest[2])}）がなくなります。`);

  const gains = base.map((c, i) => {
    const [bp, bn] = neighbors(base, i, start, end), j = prop.indexOf(c), [pp, pn] = neighbors(prop, j, start, end);
    const unchanged = (bp === pp && bn === pn) || (bp === pn && bn === pp);
    const before = detourOf(bp, c, bn), after = detourOf(pp, c, pn);
    return { c, bp, bn, pp, pn, before, after, gain: before - after, unchanged };
  }).filter(g => !g.unchanged && g.gain >= 0.1).sort((a, b) => b.gain - a.gain).slice(0, 3);
  gains.forEach(g => {
    const nearName = [g.pp, g.pn].filter(Boolean)
      .sort((a, b) => dist(g.c, a) - dist(g.c, b))[0];
    const near = nearName ? `${ptName(nearName, start, end)}に近い（約${km(dist(g.c, nearName))}）ので、` : '';
    const place = g.pp === start && start ? '出発してすぐに' : g.pn === end && end ? '帰る前に'
      : !g.pp ? '最初に' : !g.pn ? '最後に' : `${ptName(g.pp, start, end)}と${ptName(g.pn, start, end)}の間に`;
    out.push(`${label(g.c)}：${near}${place}回します。`);
  });
  return out;
}
function propose(base, start, end) {               // 短くなる順番があれば提案を返す
  const prop = optimize(base, start, end);
  const a = routeLen(base, start, end), b = routeLen(prop, start, end), saved = a - b;
  if (saved < MIN_SAVE_KM || saved / a < MIN_SAVE_RATE) return null;
  return { order: prop, baseLen: a, propLen: b, saved, reasons: explain(base, prop, start, end) };
}

/* ========== Googleマップのリンク ========== */
function mapUrl(origin, dest, ways) {
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving';
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  u += '&destination=' + encodeURIComponent(dest);
  if (ways.length) u += '&waypoints=' + encodeURIComponent(ways.join('|'));
  return u;
}
function buildLinks(addresses, start, end, maxWp) {  // 上限を超えないよう区間に分ける（順番は変えない）
  const pts = end ? [...addresses, end] : addresses.slice(), links = [];
  let origin = start || null, i = 0;
  while (i < pts.length) {
    let take = Math.min(maxWp + 1, pts.length - i);
    while (take > 1 && mapUrl(origin, pts[i + take - 1], pts.slice(i, i + take - 1)).length > MAX_URL) take--;
    const dest = pts[i + take - 1];
    links.push({ url: mapUrl(origin, dest, pts.slice(i, i + take - 1)), from: i + 1, to: Math.min(i + take, addresses.length), homeOnly: i >= addresses.length });
    origin = dest; i += take;
  }
  return links;
}

/* ========== 住所→候補・位置（国土地理院の住所検索。送るのは住所のみ） ========== */
const GEO_V = 2;                                  // 大まかな一致を位置として使わない判定の版
const KAN = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function kanToNum(k) {
  let total = 0, cur = 0;
  for (const ch of k) { if (ch === '十') { total += (cur || 1) * 10; cur = 0; } else cur = KAN[ch]; }
  return total + cur;
}
function z2h(s) {
  return String(s).replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' ').replace(/(\d)\s*[－ー−‐―ｰ-]\s*(?=\d)/g, '$1-');
}
const normNums = s => z2h(s).replace(/([一二三四五六七八九十]+)(丁目|条|番地?|号|線)/g, (_, k, u) => kanToNum(k) + u);
function splitBuilding(input) {                   // 「1-2-3 ○○ハイツ101」を番地までと建物名に分ける
  const n = normNums(input).trim(), d = /\d/.exec(n);
  if (!d) return { main: n, building: '' };
  const b = n.slice(d.index).search(/[\sァ-ヺ]/);
  return b < 0 ? { main: n, building: '' } : { main: n.slice(0, d.index + b).trim(), building: ' ' + n.slice(d.index + b).trim() };
}
const numsOf = s => s.match(/\d+/g) || [];
const fold = s => s.replace(/[ヶケが]/g, 'ケ').replace(/[ノの之]/g, 'の');
function isCoarse(input, title) {                 // 例：「三重県一志町高野」に「三重県」だけが返った状態
  const { main } = splitBuilding(input), d = /\d/.exec(main), head = d ? main.slice(0, d.index) : main;
  if (head.length < 2) return false;
  return !fold(title).includes(fold(head.slice(-2)));
}
function composeAddress(input, title) {           // 正式な地名に、入力された番地と建物名を付け直す
  const { main, building } = splitBuilding(input), t = normNums(title), inN = numsOf(main), tN = numsOf(t);
  const left = tN.every((x, i) => x === inN[i]) ? inN.slice(tN.length) : [];
  const sep = !tN.length || /番$/.test(t) ? '' : '-';
  return z2h(title) + (left.length ? sep + left.join('-') : '') + building;
}
const searchCache = new Map();
async function rawSearch(q) {
  if (searchCache.has(q)) return searchCache.get(q);
  const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q), { referrerPolicy: 'no-referrer' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const list = (await r.json())
    .map(x => ({ title: x.properties.title, lng: x.geometry.coordinates[0], lat: x.geometry.coordinates[1] }));
  searchCache.set(q, list);
  return list;
}
const hasPref = t => /^.{2,3}[都道府県]/.test(t);
async function candidates(input) {                // 県名や郡名を外した検索も試し、合併前の住所も拾う
  const { main } = splitBuilding(input);
  const prefM = main.match(/^.{2,3}[都道府県]/), pref = prefM ? prefM[0] : '';
  const noPref = main.slice(pref.length), noGun = noPref.replace(/^.*?郡/, '');
  const d = /\d/.exec(noGun), headOnly = d ? noGun.slice(0, d.index) : noGun;
  let found = [];
  for (const q of [...new Set([input.trim(), main, noPref, noGun, headOnly])].filter(Boolean)) {
    found = (await rawSearch(q)).filter(r => hasPref(r.title) && !isCoarse(input, r.title));
    if (found.length) break;
  }
  if (!found.length) {                            // 例：松阪市神ノ木町 → 町名だけで探し「嬉野神ノ木町」を見つけて市名を付け直す
    const city = (headOnly.match(/^.*?市/) || [''])[0];
    const town = headOnly.slice(city.length).replace(/^.*?区/, '');
    const variants = [...new Set([town, town.replace(/の/g, 'ノ'), town.replace(/ノ/g, 'の')])];
    for (const t of city && town.length >= 2 ? variants : []) {
      const hints = (await rawSearch(t)).filter(r => !hasPref(r.title) && fold(r.title).endsWith(fold(town)));
      for (const hint of hints.slice(0, 6)) {
        const res = await rawSearch(city + hint.title);
        found.push(...res.filter(r => hasPref(r.title) && (!pref || r.title.startsWith(pref)) && fold(r.title).endsWith(fold(hint.title))));
      }
      if (found.length) break;
    }
  }
  const seen = new Set();
  return found.slice().sort((a, b) => (b.title.startsWith(pref) && pref ? 1 : 0) - (a.title.startsWith(pref) && pref ? 1 : 0))
    .map(r => ({ ...r, address: composeAddress(input, r.title) }))
    .filter(r => !seen.has(r.address) && seen.add(r.address)).slice(0, 5);
}
async function geocode(address) {
  const list = await candidates(address);
  return list.length ? list[0] : null;
}
const addressKey = s => fold(normNums(s)).replace(/[\s\-丁目番地号の]/g, '');
const mapSearchUrl = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
const needsGeo = c => !c.manualPos && (c.geoFor !== c.address || c.geoV !== GEO_V);
function attachSuggest(input, box, onPick) {      // 入力中に正式な住所の候補を出す
  let timer, seq = 0, list = [];
  const link = () => input.value.trim() ? `<a href="${h(mapSearchUrl(input.value.trim()))}" target="_blank" rel="noopener noreferrer">この住所をGoogleマップで確認</a>` : '';
  const draw = (html = '') => { box.innerHTML = html + link(); };
  input.addEventListener('input', () => {
    clearTimeout(timer); seq++; list = [];
    const v = input.value.trim();
    draw();
    if (v.length < 4) return;
    const my = seq;
    timer = setTimeout(async () => {
      let res;
      try { res = await candidates(v); } catch (e) { if (my === seq) draw('<p class="muted">通信できず、候補を出せませんでした。</p>'); return; }
      if (my !== seq) return;
      list = res;
      draw(res.length ? res.map((r, i) => `<button type="button" data-i="${i}">${h(r.address)}</button>`).join('')
        : '<p class="muted">候補が見つかりません。市町村の合併などで住所が変わっていないか確認してください。</p>');
    }, 500);
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = list[+b.dataset.i]; if (!r) return;
    input.value = r.address; seq++; list = []; draw();
    if (onPick) onPick(r);
  });
  draw();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function ensurePositions(list, onStep) {
  let netErr = false, done = 0;
  const todo = list.filter(needsGeo);
  for (const c of todo) {
    if (onStep(++done, todo.length) === false) return false;
    try {
      const g = await geocode(c.address);
      c.lat = g ? g.lat : null; c.lng = g ? g.lng : null; c.geoTitle = g ? g.title : ''; c.geoFor = c.address; c.geoV = GEO_V;
      save();
    } catch (e) { netErr = true; break; }
    await sleep(120);
  }
  return !netErr;
}
async function placeGeo(key, address) {
  const s = db.settings;
  if (!address) { s[key] = null; return null; }
  if (s[key] && s[key].for === address && s[key].v === GEO_V) return hasPos(s[key]) ? s[key] : null;
  const g = await geocode(address);
  s[key] = { for: address, v: GEO_V, lat: g ? g.lat : null, lng: g ? g.lng : null };
  save();
  return g ? s[key] : null;
}

/* ========== CSV ========== */
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  const delim = /\t/.test(text.split('\n')[0]) ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function toCustomers(rows) {
  if (!rows.length) return [];
  let col = rows[0].length >= 3 ? { no: 0, name: 1, address: 2, lat: 3, lng: 4, manual: 5 } : { no: 0, name: -1, address: 1, lat: -1, lng: -1, manual: -1 };
  const head = rows[0].map(c => c.replace(/^﻿/, ''));
  if (head.some(c => c.includes('住所'))) {
    const f = re => head.findIndex(c => re.test(c));
    col = { no: f(/番号|No/i), name: f(/名前|氏名/), address: f(/住所/), lat: f(/緯度/), lng: f(/経度/), manual: f(/位置指定/) };
    rows = rows.slice(1);
  }
  return rows.map((r, i) => {
    const address = r[col.address] || '', lat = parseFloat(r[col.lat]), lng = parseFloat(r[col.lng]), ok = Number.isFinite(lat) && Number.isFinite(lng);
    return { id: uid() + i, no: r[col.no] || String(i + 1), name: col.name >= 0 ? (r[col.name] || '') : '', address, lat: ok ? lat : null, lng: ok ? lng : null, geoFor: ok ? address : null, geoV: ok ? GEO_V : null, manualPos: ok && r[col.manual] === '1', geoTitle: '' };
  }).filter(c => c.address);
}
function decodeFile(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('shift_jis').decode(buf); }      // Excelの標準CSV
}
function exportCsv() {
  if (!confirm('CSVファイルは暗号化されず、名前と住所をそのまま読めます。保存しますか？\n保存先は安全な場所1か所にし、不要になったファイルは消してください。')) return;
  const q = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : (v ?? '');
  const lines = [['番号', '名前', '住所', '緯度', '経度', '位置指定'], ...db.customers.map(c => [c.no, c.name, c.address, c.lat, c.lng, c.manualPos ? 1 : ''])].map(r => r.map(q).join(','));
  const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `顧客リスト_${dateStr()}.csv` });
  a.click(); URL.revokeObjectURL(url);
}

async function makeRoute() {
  const sess = lockSession;
  busy = '位置を確認しています…'; show('route');
  const ck = new Set(db.today.checked), stops = db.customers.filter(c => ck.has(c.id));
  const s = db.settings, end = s.sameEnd ? s.start : s.end;
  const ok = await ensurePositions(stops, (i, n) => {
    if (sess !== lockSession) return false;
    busy = `住所の位置を確認中（${i}/${n}）…`; renderRoute();
  });
  let startP = null, endP = null, netErr = !ok;
  if (sess === lockSession) try { startP = await placeGeo('startGeo', s.start); endP = await placeGeo('endGeo', end); } catch (e) { netErr = true; }
  if (sess !== lockSession) return;
  busy = '';
  const located = stops.filter(hasPos), lost = stops.filter(c => !hasPos(c));
  const proposal = located.length >= 2 ? propose(located, s.start ? startP : null, end ? endP : null) : null;
  const saved = db.today.order && db.today.order.length === stops.length && db.today.order.every(id => ck.has(id)) ? db.today.order : null;
  routeState = { baseIds: stops.map(c => c.id), proposal: proposal && { ...proposal, order: [...proposal.order, ...lost].map(c => c.id) }, lostIds: lost.map(c => c.id), netErr, startMissing: !!s.start && !startP, startP, endP };
  if (!saved) db.today.order = routeState.baseIds.slice();
  save(); render();
}
const byId = id => db.customers.find(c => c.id === id);
const sameOrder = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
const seqText = ids => ids.map(id => byId(id)?.no).join(' → ');

function renderRoute() {
  if (busy) { view.innerHTML = `<div class="empty">${h(busy)}</div>`; return; }
  const st = routeState, order = db.today.order;
  if (!st && order && order.length) { makeRoute(); return; }   // 再読み込みやロック解除の後は今日のルートを復元
  if (!st || !order || !order.length) {
    view.innerHTML = `<div class="empty">配達チェックで今日のお客様を選び、「ルートを作る」を押してください。<br><br><button class="primary" data-go="check">配達チェックへ</button></div>`;
    return;
  }
  const stops = order.map(byId).filter(Boolean), s = db.settings, end = s.sameEnd ? s.start : s.end;
  const startP = s.start ? st.startP : null, endP = end ? st.endP : null;
  const isBase = sameOrder(order, st.baseIds), p = st.proposal, isProp = p && sameOrder(order, p.order);
  const links = buildLinks(stops.map(c => c.manualPos && hasPos(c) ? `${c.lat},${c.lng}` : c.address), s.start, end, s.maxWp);
  const located = stops.filter(hasPos);
  let warnings = '';
  if (st.netErr) warnings += `<div class="card warn">通信できず、位置を確認できなかった住所があります。電波の良い場所で作り直すと提案が出ます。<br><button data-act="rebuild">作り直す</button></div>`;
  if (!s.start) warnings += `<div class="card warn">出発地が未設定です。地図は現在地から始まり、提案の精度も下がります。<button data-go="set">設定する</button></div>`;
  if (st.startMissing) warnings += `<div class="card warn">出発地の住所の位置が取得できませんでした。設定を確認してください。</div>`;
  if (st.lostIds.length) warnings += `<div class="card warn"><b>位置が分からない住所：</b>${st.lostIds.map(id => h(label(byId(id)))).join('、')}<br>提案では最後に回しています。顧客リストで住所か緯度経度を直してください。</div>`;
  const far = farOnes(located, startP);

  let suggest = '';
  if (p && !isProp) {
    suggest = `<div class="card suggest"><h3>もっと短い順番があります</h3>

      <p class="seq"><b>いつもの順：</b>${h(seqText(st.baseIds))}<br><b>提案：</b>${h(seqText(p.order))}</p>
      <ul>${p.reasons.map(r => `<li>${h(r)}</li>`).join('')}</ul>

  } else if (isProp) {

  } else if (isBase && !st.netErr && !st.lostIds.length && !st.startMissing && located.length >= 2) {
    suggest = `<div class="card">いつもの順で問題ありません。これより明らかに短い順番は見つかりませんでした。</div>`;

    <h2>今日のルート（${stops.length}件・${km(routeLen(located, startP, endP))}目安）</h2>

      <a class="primary" href="${h(l.url)}" target="_blank" rel="noopener noreferrer">${links.length > 1 ? `区間${i + 1}：` : ''}${l.homeOnly ? '帰着地まで' : `${l.from}〜${l.to}軒目`}をGoogleマップで開く</a>`).join('')}
      ${links.length > 1 ? `<p class="muted">Googleマップの上限のため${links.length}区間に分かれています。区間を走り終えたら次のボタンを押してください。</p>` : ''}

        <button class="mv" data-down="${i}" ${i < stops.length - 1 ? '' : 'disabled'} aria-label="下へ">↓</button>
      </div>`).join('')}</div>`;
}
function farOnes(list, start) {
  if (!list.length) return [];
  const mid = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
  const base = start || { lat: mid(list.map(c => c.lat)), lng: mid(list.map(c => c.lng)) };
  return list.filter(c => dist(base, c) > FAR_KM);
}
function moveStop(i, d) {

}

async function checkAll() {                       // 全員の住所を調べ、書き換えが必要なものだけ一覧にする

      save();

    <div class="row-line"><button class="primary" value="ok">登録</button><button value="cancel">やめる</button></div>`;
  fFile.onchange = async () => { if (fFile.files[0]) fCsv.value = decodeFile(await fFile.files[0].arrayBuffer()); };
  dlg.returnValue = '';
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok') return;
    const list = toCustomers(parseCsv(fCsv.value));
    if (!list.length) { alert('読み取れる行がありませんでした。列の形式を確認してください。'); return; }
    if (db.customers.length && !confirm(`今の${db.customers.length}件を、${list.length}件で置き換えますか？`)) return;
    db.customers = list; issues = null; setChecked([]); render();
    alert(`${list.length}件を登録しました。続けて「住所を確認」を押すと、地図に出ない可能性がある住所を確認できます。`);
  };
  dlg.showModal();
}

function renderSet() {
  const s = db.settings;
  view.innerHTML = `
    <h2>ルート</h2>
    <label class="f">出発地（営業所など）<input type="text" id="sStart" value="${h(s.start)}" placeholder="住所を入力" autocomplete="off"></label>
    <div class="sg" id="sStartBox"></div>
    <label class="f"><input type="checkbox" id="sSame" ${s.sameEnd ? 'checked' : ''}> 出発地に戻る</label>
    <div id="endWrap" ${s.sameEnd ? 'hidden' : ''}>
      <label class="f">帰着地（空なら最後の配達先で終了）<input type="text" id="sEnd" value="${h(s.end)}" autocomplete="off"></label>
      <div class="sg" id="sEndBox"></div>
    </div>
    <label class="f">1区間に入れる経由地の数
      <select id="sWp"><option value="9" ${s.maxWp == 9 ? 'selected' : ''}>9件（アプリで開く場合）</option><option value="3" ${s.maxWp == 3 ? 'selected' : ''}>3件（スマホのブラウザで開く場合）</option></select></label>
    <h2>セキュリティ</h2>
    <label class="f">操作しないとロックするまでの時間
      <select id="sLock">${[5, 15, 30, 60].map(m => `<option value="${m}" ${s.autoLockMin == m ? 'selected' : ''}>${m}分</option>`).join('')}</select></label>
    <div class="row-line"><button data-act="lockNow">今すぐロック</button><button data-act="changePin">PINを変更</button></div>
    <h2>個人情報の扱い</h2>
    <div class="card muted">
      顧客データと設定は、この端末のブラウザ内にPINで暗号化して保存されます。<br>
      住所は位置確認のため国土地理院へ、地図表示のためGoogleへ送られます。名前と番号は送信しません。<br>
      ブラウザのデータを消すとリストも消え、PINを忘れると元に戻せません。顧客画面の「CSVに保存」で控えを1つ、安全な場所に保管してください。
    </div>
    <h2>データ</h2>
    <button class="danger" data-act="wipe">この端末のデータをすべて消す</button>`;
  const saveS = () => { s.start = sStart.value.trim(); s.sameEnd = sSame.checked; s.end = sEnd.value.trim(); s.maxWp = +sWp.value; s.autoLockMin = +sLock.value; routeState = null; save(); endWrap.hidden = s.sameEnd; };
  [sStart, sSame, sEnd, sWp, sLock].forEach(el => el.onchange = saveS);
  attachSuggest(sStart, sStartBox, saveS);
  attachSuggest(sEnd, sEndBox, saveS);
}
function changePinDialog() {
  dlgForm.innerHTML = `
    <h3 style="margin:0">PINを変更</h3>
    <label class="f">今のPIN<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pOld"></label>
    <label class="f">新しいPIN（6文字以上の英字・数字・記号）<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pNew"></label>
    <label class="f">新しいPIN（確認）<input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="pNew2"></label>
    <div class="row-line"><button class="primary" value="ok">変更</button><button value="cancel">やめる</button></div>`;
  dlg.returnValue = '';
  dlg.onclose = async () => {
    if (dlg.returnValue !== 'ok') return;
    const oldPin = pOld.value, pin = pNew.value, problem = pinProblem(pin);
    if (problem) { alert(problem); return; }
    if (pin !== pNew2.value) { alert('新しいPINが一致しません'); return; }
    await saveQueue;
    if (!await openRecord(oldPin)) { alert('今のPINが違います'); return; }
    await setPin(pin, db);
    alert('PINを変更しました');
  };
  dlg.showModal();
}

/* ========== ロック画面 ========== */
const gate = document.getElementById('gate');
function readFails() { try { return JSON.parse(localStorage.getItem(KEY_FAIL)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function afterUnlock() {
  gate.innerHTML = '';
  document.body.classList.remove('locked');
  lastActive = Date.now();
  rollDay();
  tab = db.today.order && db.today.order.length ? 'route' : 'check';
  render();
}
function showGate(mode) {
  document.body.classList.add('locked');
  const setup = mode === 'setup', migrating = setup && !!readV1();
  gate.innerHTML = `<form id="gForm">
    <h1>${setup ? 'PINを決めてください' : '配達ルート'}</h1>
    <p class="muted">${setup ? `6文字以上で決めてください。英字（大文字・小文字）、数字、記号が使えます。長いほど安全で、8文字以上がおすすめです。顧客データはこのPINで暗号化されます。<br><b>PINを忘れるとデータは元に戻せません。</b>${migrating ? '<br>登録済みのデータは暗号化して引き継ぎます。' : ''}` : 'PINを入力してください'}</p>
    <input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="gPin" aria-label="PIN" autofocus>
    ${setup ? '<p class="muted">確認のためもう一度</p><input type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" id="gPin2" aria-label="PIN確認">' : ''}
    <label class="muted"><input type="checkbox" id="gShow" style="width:auto"> 入力を表示</label>
    <p class="err" id="gErr" role="alert"></p>
    <button class="primary" id="gOk">${setup ? 'このPINで始める' : 'ロック解除'}</button>
    ${setup ? '' : '<button type="button" class="link" id="gForgot">PINを忘れた</button>'}
  </form>`;
  const err = document.getElementById('gErr'), ok = document.getElementById('gOk'), pinEl = document.getElementById('gPin');
  document.getElementById('gShow').onchange = e => {
    gate.querySelectorAll('#gPin,#gPin2').forEach(el => { el.type = e.target.checked ? 'text' : 'password'; });
  };
  document.getElementById('gForm').onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    const pin = pinEl.value;
    ok.disabled = true;
    try {
      if (setup) {
        const problem = pinProblem(pin);
        if (problem) { err.textContent = problem; return; }
        if (pin !== document.getElementById('gPin2').value) { err.textContent = 'PINが一致しません'; return; }
        await setPin(pin, readV1() || blank());
        localStorage.removeItem(KEY_V1);
        afterUnlock();
        return;
      }
      const f = readFails();
      if (Date.now() < f.until) { err.textContent = `入力を間違えすぎました。あと${Math.ceil((f.until - Date.now()) / 1000)}秒待ってください`; return; }
      const opened = await openRecord(pin);
      if (!opened) {
        f.n++;
        if (f.n >= 5) f.until = Date.now() + Math.min(30000 * 2 ** (f.n - 5), 3600000);
        localStorage.setItem(KEY_FAIL, JSON.stringify(f));
        pinEl.value = '';
        err.textContent = 'PINが違います';
        return;
      }
      localStorage.removeItem(KEY_FAIL);
      cryptoKey = opened.key; keyMeta = opened.meta; db = opened.data;
      afterUnlock();
    } finally { ok.disabled = false; }
  };
  const forgot = document.getElementById('gForgot');
  if (forgot) forgot.onclick = () => {
    if (prompt('PINが分からないとデータは読めません。\nこの端末の顧客データをすべて消して最初からやり直す場合は「削除」と入力してください。') !== '削除') return;
    wipeAll();
  };
}
function lock() {
  if (!cryptoKey) return;
  lockSession++;
  cryptoKey = null; keyMeta = null; db = blank(); routeState = null; busy = ''; query = ''; issues = null; checking = '';
  if (dlg.open) dlg.close('cancel');
  view.innerHTML = '';
  showGate('unlock');
}
function wipeAll() {
  lockSession++;
  cryptoKey = null; keyMeta = null; db = blank(); routeState = null; busy = ''; view.innerHTML = '';
  [KEY_ENC, KEY_FAIL, KEY_V1].forEach(k => localStorage.removeItem(k));
  showGate('setup');
}
function checkIdle() {
  if (cryptoKey && !busy && Date.now() - lastActive > db.settings.autoLockMin * 60000) lock();
}
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkIdle(); });
setInterval(checkIdle, 30000);

const dlg = document.getElementById('dlg'), dlgForm = document.getElementById('dlgForm');
document.getElementById('tabs').onclick = e => { const t = e.target.dataset.tab; if (t) show(t); };
makeBtn.onclick = makeRoute;
view.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ck) {
    const set = new Set(db.today.checked);
    t.checked ? set.add(t.dataset.ck) : set.delete(t.dataset.ck);
    setChecked([...set]);
    t.closest('.cust').classList.toggle('on', t.checked);
    if (onlyChecked && !t.checked) drawRows();
    updateBottom();
  }
  if (t.dataset.pos !== undefined) {
    const from = +t.dataset.pos, to = Math.min(Math.max(+t.value || 1, 1), db.customers.length) - 1;
    const [c] = db.customers.splice(from, 1); db.customers.splice(to, 0, c);
    routeState = null; db.today.order = null; save(); renderList();
  }
});
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) show(d.go);
  if (d.edit) editDialog(byId(d.edit));
  if (d.fix) fixAddress(d.fix);
  if (d.act === 'checkAll') checkAll();
  if (d.up) moveStop(+d.up, -1);
  if (d.down) moveStop(+d.down, 1);
  if (d.act === 'add') editDialog();
  if (d.act === 'import') importDialog();
  if (d.act === 'export') exportCsv();
  if (d.act === 'rebuild') makeRoute();
  if (d.act === 'useProp') { db.today.order = routeState.proposal.order.slice(); save(); renderRoute(); window.scrollTo(0, 0); }
  if (d.act === 'useBase') { db.today.order = routeState.baseIds.slice(); save(); renderRoute(); }
  if (d.act === 'lockNow') lock();
  if (d.act === 'changePin') changePinDialog();
  if (d.act === 'wipe' && confirm('顧客リストと設定をすべて消します。よろしいですか？')) wipeAll();
});
if (!window.crypto || !crypto.subtle) {
  gate.innerHTML = '<div class="empty">この開き方では暗号化が使えません。https:// のURLから開いてください。</div>';
} else {
  showGate(readRecord() ? 'unlock' : 'setup');
}
</script>
</body>
</html>
